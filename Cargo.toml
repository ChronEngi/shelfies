[package]
name = "shelfies"
version = "0.4.1"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_10"] }
libadwaita = { version = "0.9.2", features = ["v1_4", "v1_5"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "9.0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
